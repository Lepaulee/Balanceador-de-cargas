services:
  haproxy:
    image: haproxy:2.9-alpine
    container_name: lb_haproxy
    ports:
      - "8080:8080"
      - "3306:3306"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - web1
      - web2
      - mysql-primary
      - mysql-replica
      - mysql-replica-2
      - mysql-replica-3
    networks:
      lb_network:
        ipv4_address: 192.168.100.10
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web1:
    build: .
    container_name: web1
    volumes:
      - ./web1/html:/var/www/html:ro
    environment:
      - TZ=America/Mexico_City
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      lb_network:
        ipv4_address: 192.168.100.11
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web2:
    build: .
    container_name: web2
    volumes:
      - ./web2/html:/var/www/html:ro
    environment:
      - TZ=America/Mexico_City
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      lb_network:
        ipv4_address: 192.168.100.12
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql-primary:
    image: mysql:8.0
    container_name: mysql_primary
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: RootSuperSeguro2026!
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: app_user
      MYSQL_PASSWORD: PasswordSeguro123!
    volumes:
      - mysql_primary_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootSuperSeguro2026!"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      lb_network:
        ipv4_address: 192.168.100.13
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql-replica:
    image: mysql:8.0
    container_name: mysql_replica
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: RootSuperSeguro2026!
    depends_on:
      mysql-primary:
        condition: service_healthy
    volumes:
      - mysql_replica_data:/var/lib/mysql
    networks:
      lb_network:
        ipv4_address: 192.168.100.14
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql-replica-2:
    image: mysql:8.0
    container_name: mysql_replica_2
    command:
      - --server-id=3
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: RootSuperSeguro2026!
    depends_on:
      mysql-primary:
        condition: service_healthy
    volumes:
      - mysql_replica_2_data:/var/lib/mysql
    networks:
      lb_network:
        ipv4_address: 192.168.100.15
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql-replica-3:
    image: mysql:8.0
    container_name: mysql_replica_3
    command:
      - --server-id=4
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: RootSuperSeguro2026!
    depends_on:
      mysql-primary:
        condition: service_healthy
    volumes:
      - mysql_replica_3_data:/var/lib/mysql
    networks:
      lb_network:
        ipv4_address: 192.168.100.16
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lb_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1

volumes:
  mysql_primary_data:
  mysql_replica_data:
  mysql_replica_2_data:
  mysql_replica_3_data:
