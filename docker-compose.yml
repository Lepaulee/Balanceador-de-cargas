services:
  haproxy:
    image: haproxy:2.9-alpine
    container_name: lb_haproxy
    ports:
      - "8080:8080"
      - "3306:3306"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - web1
      - web2
      - mysql-primary
    networks:
      lb_network:
        ipv4_address: 192.168.100.10
    restart: "no"
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web1:
    build: .
    container_name: web1
    volumes:
      - ./web1/html:/var/www/html
    environment:
      - TZ=America/Mexico_City
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      lb_network:
        ipv4_address: 192.168.100.11
    restart: "no"
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web2:
    build: .
    container_name: web2
    volumes:
      - ./web2/html:/var/www/html
    environment:
      - TZ=America/Mexico_City
    depends_on:
      mysql-primary:
        condition: service_healthy
    networks:
      lb_network:
        ipv4_address: 192.168.100.12
    restart: "no"
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql-primary:
    image: mysql:8.0
    container_name: mysql_primary
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: RootSuperSeguro2026!
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: app_user
      MYSQL_PASSWORD: PasswordSeguro123!
    volumes:
      - mysql_primary_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootSuperSeguro2026!"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      lb_network:
        ipv4_address: 192.168.100.13
    restart: "no"
    mem_limit: 768m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Réplicas comentadas para evitar colapsar la RAM durante el inicio
  # mysql-replica:
  #   image: mysql:8.0
  #   container_name: mysql_replica
  #   command:
  #     - --server-id=2
  #     - --log-bin=mysql-bin
  #     - --gtid-mode=ON
  #     - --enforce-gtid-consistency=ON
  #     - --binlog-format=ROW
  #   environment:
  #     MYSQL_ROOT_PASSWORD: RootSuperSeguro2026!
  #   depends_on:
  #     mysql-primary:
  #       condition: service_healthy
  #   volumes:
  #     - mysql_replica_data:/var/lib/mysql
  #   networks:
  #     lb_network:
  #       ipv4_address: 192.168.100.14
  #   restart: "no"
  #   mem_limit: 512m
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  # mysql-replica-2:
  #   ... (Desactivada para ahorrar memoria)

  # mysql-replica-3:
  #   ... (Desactivada para ahorrar memoria)

  ollama:
    image: ollama/ollama
    container_name: ia_ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      lb_network:
        ipv4_address: 192.168.100.20
    restart: "no"
    mem_limit: 2g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  vector_db:
    image: chromadb/chroma
    container_name: ia_vectores
    environment:
      - IS_PERSISTENT=TRUE
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      lb_network:
        ipv4_address: 192.168.100.21
    restart: "no"
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lb_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1

volumes:
  mysql_primary_data:
  mysql_replica_data:
  mysql_replica_2_data:
  mysql_replica_3_data:
  ollama_data:
  chroma_data:
